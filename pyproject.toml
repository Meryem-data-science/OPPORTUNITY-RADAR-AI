[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Foundation for the Opportunity Radar AI data service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "google-api-python-client>=2.149,<3",
    "google-auth>=2.35,<3",
    "google-auth-oauthlib>=1.2,<2",
    "httpx>=0.27,<1",
    "libsql>=0.1.11,<0.2",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
