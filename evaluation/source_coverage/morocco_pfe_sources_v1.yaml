  # ---------------------------------------------------------------- P1 -----
  # The collector candidates, in the order the architect fixed: Stagiaires.ma,
  # then Stage.ma, then the TalentSoft-hosted career sites. Stagiaires.ma is
  # implemented and ACTIVE since Phase 7C.4B, and Stage.ma is implemented and
  # ACTIVE since Phase 7C.5B — on one specialty listing, and after a live run
  # that validated the collector while collecting nothing, which its own note
  # records. The TalentSoft-hosted career sites remain unverified and are not
  # integrated. ReKrute used to head this list; Phase 7C.3 evaluated it and did
  # not select it, so it now sits in the evaluated/not-selected section at the
  # end of this file.
  - id: stagiaires_ma
    name: Stagiaires.ma
    homepage_url: https://www.stagiaires.ma
    homepage_url_status: EVIDENCED
    source_class: INTERNSHIP_BOARD
    priority: P1
    coverage_role: PRIMARY
    collection_strategy: EXISTING_COLLECTOR
    integration_status: ACTIVE
    country: MA
    production_source_id: stagiaires_ma
    live_canary: false
    notes: >-
      Internship-specific board, so its listings are close to the product's
      narrowed scope. It collects. Phase 7C.4A established public feasibility
      and structure; Phase 7C.4B added the bounded production collector behind
      the config/sources.yaml row stagiaires_ma, and this entry is ACTIVE
      because a real local validation proved it works, not because the code
      exists. Production discovery follows the site's own chain: robots.txt, the
      official sitemap it declares, the offre-sitemap*.xml family read from that
      index, and a bounded set of offer detail pages capped by
      detail_page_limit, which is 25. The public PFE listing is a
      client-rendered application and is deliberately NOT the discovery
      mechanism; the sitemap chain needs no browser. Real evidence, from the
      user's local Windows run against PR #80: a GET-only production dry-run
      succeeded and observed 25 candidates with real titles, organizations,
      Morocco locations and stagiaires.ma detail URLs, persisting nothing;
      against a fresh dedicated SQLite validation database, run #1 created 25
      opportunities and 25 qualification rows, and run #2 created 0 and updated
      25 with 25 qualifications unchanged, both runs recording SUCCESS with
      parser_version stagiaires-jsonld-v1. 25 source links resolved to 25
      distinct opportunities across 25 distinct source URLs, with no duplicate
      source URL observed. That is idempotence demonstrated for the batch
      observed on that day, and nothing broader is claimed. The numeric ID in
      /stage-emploi-maroc/<id> remains only a CANDIDATE source_external_id: no
      database constraint keys on it, and a larger ID is NOT treated as evidence
      of a more recent publication anywhere, including the collector's fetch
      order. Sitemap <lastmod> remains page-modification metadata used only to
      decide which pages a bounded run refreshes first; it is NOT a publication
      date and nothing maps it to published_at, which comes solely from the
      posting's own datePosted and is null when the page states none. No bypass
      of anything was attempted or implemented: no browser automation, no
      browser impersonation, no proxy, no CAPTCHA handling, no authentication,
      no user cookies, no private API found in a JS bundle. This entry makes NO
      legal claim in either direction; a public HTTP 200 is reachability, not
      permission, and the site's terms remain a separate question for a human.
      The 7C.4A audit that established feasibility is still reusable at
      evaluation/morocco_pfe/cli/stagiaires_access_audit.py.

  - id: stage_ma
    name: Stage.ma
    homepage_url: https://www.stage.ma
    homepage_url_status: EVIDENCED
    source_class: INTERNSHIP_BOARD
    priority: P1
    coverage_role: PRIMARY
    collection_strategy: EXISTING_COLLECTOR
    integration_status: ACTIVE
    country: MA
    production_source_id: stage_ma
    live_canary: false
    notes: >-
      The source of both seed rows of morocco_pfe_gold_v1, which is why its
      domain is evidenced rather than assumed. Being a benchmark source did not
      make it a collected one; a Phase 7C.5B collector, validated against the
      live site, is what did. This entry is ACTIVE behind the config/sources.yaml
      row stage_ma, and the 7C.5B paragraph at the end of this note records the
      validation run in full, including the part that is easy to misread: it
      collected nothing on the day it ran. Phase 7C.5A ran a bounded, GET-only,
      robots-obeying public audit locally and it COMPLETED with exit 0 and a
      feasibility of PUBLIC_HTML_CANDIDATE — evidence for considering a later
      7C.5B, not approval of one. What that run actually observed:
      https://www.stage.ma/robots.txt returned HTTP 200 as text/plain, its
      single applicable group was obeyed, the audited targets were allowed, and
      it declared NO Sitemap. No sitemap filename was guessed and no sitemap was
      fetched, so there is no sitemap-based discovery evidence for this source
      either way. Of the three fixed public surfaces, the homepage and the
      generic /offres-stage listing returned HTTP 200 but exposed ZERO offer
      detail URLs in ordinary server HTML, so /offres-stage is NOT established
      as a usable discovery surface. /specialites/computer-science exposed 10
      real /offres-stage/<numeric-id>-<slug> URLs directly in server-returned
      HTML, needing no browser and no JavaScript execution — that one specialty
      surface is the whole of the browser-free discovery evidence, and nothing
      here claims the other specialties behave the same way or that this covers
      Stage.ma as a whole. Discovery did not fall back on the historical
      benchmark canaries. Three live-discovered detail pages were sampled and
      all returned HTTP 200 and exposed schema.org JobPosting. All three carried
      a title; only ONE of the three exposed a usable organization name through
      the audit's structural evidence, and location was likewise absent on the
      sampled pages — organization and location completeness are therefore NOT
      proven, and any later architecture must decide conservatively what to do
      when they are missing. All three sampled pages were EXPIRED at audit time,
      which says nothing about whether the source currently carries active
      offers. All three exposed JobPosting.datePosted as a valid candidate
      normalized to 2026-03-23; this audit persisted nothing and asserted no
      published_at, and no crawl time, sitemap timestamp or numeric URL id was
      used as a substitute. No 1970 sentinel appeared in this three-page sample,
      which does not retire the audit's sentinel protection. All three showed an
      explicit "Postuler" application intent but no usable href was established
      through the generic extraction, so no application_url is claimed and
      nothing off-domain was fetched. The numeric ID in
      /offres-stage/<id> remains only a CANDIDATE source_external_id and is
      never read as recency or as a date. No browser automation, browser
      impersonation, JavaScript execution, authentication, cookies, proxy,
      CAPTCHA handling, private API or bypass of any kind was used. This entry
      makes NO legal claim in either direction: a public HTTP 200 is
      reachability, not permission, and the site's terms remain a question for a
      human. Phase 7C.5B — the production collector — is recorded next.
      PHASE 7C.5B, real local production evidence, and the basis of this entry's
      ACTIVE status. The collector code exists and was validated live at collector
      SHA 2cbb703c7eb769e927667915bb237ac9de019903. The user ran a bounded,
      GET-only production dry-run locally against the approved discovery surface
      /specialites/computer-science, and it COMPLETED successfully with exit 0:
      the run succeeded, items_found was 0 and items_returned was 0. A read-only
      diagnostic through the same configured collector explains the zero. Ten
      live-discovered offer detail pages were actually read, and all TEN were
      explicitly EXPIRED, so ZERO admissible candidates remained on the validation
      date. pages_checked was 12 and parser_version was stage-ma-html-v1. Nothing
      about that zero was a defect: no network barrier, no robots refusal, no
      parser structural failure and no organization failure produced it, and no
      candidate was invented to avoid it. Ten expired offers are ten discovered
      listing entries, not ten current opportunities, and no historical or expired
      offer was persisted to manufacture an activation. NO SQLite candidate
      double-run was performed, and none could be: with N=0 admissible candidates
      there is nothing to persist twice, so opportunity idempotence is NOT proven
      for Stage.ma and this note does not claim it is. The Architect nevertheless
      approved activation, and the reasoning is recorded here rather than assumed:
      what a run must demonstrate is that the collector reads the site correctly
      and reports honestly, and this one did both; an empty result that truthfully
      describes a surface carrying only expired offers on one day is a valid
      successful run, not a failure, and holding the source dormant would only
      guarantee that a newly published offer is never seen. So collection_strategy
      is EXISTING_COLLECTOR, integration_status is ACTIVE and production_source_id
      is stage_ma, matching the enabled, status: active row in config/sources.yaml
      that RadarAgent reads. live_canary stays false: nothing here runs
      continuously against the live site. Future RadarAgent runs may collect newly
      published admissible opportunities from this surface, and "future run" means
      the next time RadarAgent is executed — Phase 7C.5B added no scheduler, and
      frequency_minutes remains metadata that nothing acts on yet. Coverage is
      still only /specialites/computer-science, one specialty listing: this is NOT
      Stage.ma as a whole, no other specialty is crawled, no sitemap exists to
      follow, and no pagination is discovered.

