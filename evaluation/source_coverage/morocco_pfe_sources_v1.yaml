    priority: P0
    coverage_role: PRIMARY
    collection_strategy: GMAIL_ALERT
    integration_status: ACTIVE
    country: MA
    production_source_id: linkedin_job_alert_email
    live_canary: false
    notes: >-
      The first source in this map that collected, and since Phase 7C.4B no
      longer the only one. Opportunities are read
