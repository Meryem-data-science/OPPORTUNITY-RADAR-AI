# Phase 7C.1 — the declared Morocco PFE/stage source universe, version 1.
#
# Created in 7C.1 and amended since by the phases that evaluated individual
# entries; the map's identity (`version`, `created_for_phase`) is unchanged by
# those amendments, which only correct what an entry claims about itself.
#
# THIS FILE IS NOT config/sources.yaml AND ACTIVATES NOTHING.
#
# `config/sources.yaml` is the operational catalogue: a row there is collected
# by the RadarAgent. A row *here* is a statement of what we want our coverage to
# be measured against — the explicit denominator of every recall number Phase
# 7C will ever publish. Nothing here is loaded by a collector, by the factory or
# by the agent, and the only link between the two files is
# `production_source_id`, which is null for everything that does not already run.
#
# What is deliberately not claimed here:
#
# * no scraper, API, feed or export is asserted to exist for any site below.
#   Where we do not know, the entry says NEEDS_VERIFICATION and its note says
#   what is unverified, rather than describing a capability nobody has checked;
# * almost no homepage URL below has been fetched. `homepage_url_status` says
#   whether the URL is evidence (EVIDENCED — either handed to us, or confirmed
#   by a real request in a later phase), a domain written from public knowledge
#   and not confirmed (WELL_KNOWN_UNVERIFIED), or absent (UNKNOWN). Three entries
#   have URLs that were actually requested: ReKrute, whose public robots.txt and
#   terms pages Phase 7C.3 reached; Stagiaires.ma, whose robots.txt, public PFE
#   listing and official sitemap chain a bounded GET-only Phase 7C.4A audit
#   reached; and Stage.ma, whose robots.txt, public listings and offer detail
#   pages the bounded GET-only Phase 7C.5A audit reached and the Phase 7C.5B
#   collector then read in a real production run. All three read EVIDENCED for
#   that reason and for no other. No other entry's status should be read as a
#   claim that anyone visited it;
# * LinkedIn is collected from Gmail job-alert mail and from nothing else. There
#   is no LinkedIn scraping in this project and the strategy registry has no
#   member that would describe one.

map_name: morocco_pfe_source_coverage
version: v1
scope_country: MA
created_for_phase: "7C.1"
is_production_registry: false
production_registry_path: config/sources.yaml

sources:
